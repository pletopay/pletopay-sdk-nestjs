# Pull-request and main-branch gates. Until @pletopay/node is on npm the sibling repo is checked out and built.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verify (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        nest: ['10', '11', '12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pletopay-sdk-nestjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: evidenze/pletopay-sdk-node
          path: pletopay-sdk-node
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pletopay-sdk-nestjs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build the Node SDK
        run: pnpm --dir pletopay-sdk-node install --frozen-lockfile && pnpm --dir pletopay-sdk-node build
      - name: Install
        run: pnpm --dir pletopay-sdk-nestjs install --frozen-lockfile
      - name: Pin the NestJS major under test
        if: ${{ matrix.nest != '11' }}
        run: pnpm --dir pletopay-sdk-nestjs add -D @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }} @nestjs/platform-fastify@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }}
      - name: Verify
        run: pnpm --dir pletopay-sdk-nestjs verify
